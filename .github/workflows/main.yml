name: Build GENRA

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make zip tar zstd sed
            mingw-w64-x86_64-gcc

      - name: Build plugin
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=sdk/Rack-SDK SLUG=Genra VERSION=$VER -j4 dist

      - name: Check the package
        run: |
          ls -la dist/Genra dist/Genra/res
          test -f dist/Genra/plugin.dll
          for c in voicecore drumcore animalcore; do test -f dist/Genra/res/$c.dll; done

      - uses: actions/upload-artifact@v4
        with:
          name: genra-windows
          path: dist/*.vcvplugin
