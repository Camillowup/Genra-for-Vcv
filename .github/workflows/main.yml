name: Build GENRA

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make zip tar zstd sed
            mingw-w64-x86_64-gcc

      - name: Tests (engines, without Rack)
        run: |
          for t in test/test_mono.cpp test/test_schmelz.cpp test/test_mix.cpp test/test_funke.cpp test/test_stotter.cpp test/test_grund.cpp test/test_genrafx.cpp; do
            g++ -std=gnu++17 -O2 "$t" -o t.exe && ./t.exe || exit 1
          done
          gcc -std=gnu11 -O2 -w -ffreestanding -fno-builtin -fno-tree-loop-distribute-patterns -Ikwasub/firmware/src -Ikwasub/firmware/gen -Ikwasub/firmware/hal test/kwcore_test.c -o kt.exe -lm
          ./kt.exe
          for t in test/test_tracks.cpp test/test_edit.cpp test/test_store.cpp test/test_midi.cpp; do
            g++ -std=gnu++17 -O2 -Isrc "$t" src/Engine.cpp src/Genres.cpp src/Edit.cpp src/Store.cpp src/Midi.cpp -o t.exe && ./t.exe || exit 1
          done
          g++ -std=gnu++17 -O2 -Isrc test/test_ablauf.cpp src/Arranger.cpp src/Engine.cpp src/Genres.cpp src/Edit.cpp src/Store.cpp src/Midi.cpp -o ta.exe && ./ta.exe

      - name: Build plugin
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=sdk/Rack-SDK SLUG=Genra VERSION=$VER -j4 dist

      - name: Test the VADER engine (UMLAUF, without Rack)
        run: |
          gcc -std=gnu11 -O2 -Ivader/src -Ivader/third_party/mpc-vst-plugins/wrapper test/vader_test.c build/vader/libvader.a -lstdc++ -lm -lpthread -o vt.exe
          ./vt.exe vader/shapes

      - name: Check the package
        run: |
          ls -la dist/Genra dist/Genra/res
          test -f dist/Genra/plugin.dll
          for c in voicecore drumcore animalcore kwcore; do test -f dist/Genra/res/$c.dll; done
          test -f dist/Genra/res/Umlauf.svg
          test -f dist/Genra/res/Funke.svg
          test -f dist/Genra/res/Stotter.svg
          ls dist/Genra/res/umlauf/shapes
          objdump -p dist/Genra/plugin.dll | grep "DLL Name"
          ! objdump -p dist/Genra/plugin.dll | grep -iE "libwinpthread|libstdc"

      - uses: actions/upload-artifact@v4
        with:
          name: genra-windows
          path: dist/*.vcvplugin
