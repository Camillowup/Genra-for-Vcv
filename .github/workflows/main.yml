name: Build GENRA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # a push to the branch "release" publishes GitHub release v<version> with the plugin

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make zip tar zstd sed
            mingw-w64-x86_64-gcc

      - name: Tests (engines, without Rack)
        run: |
          for t in test/test_mono.cpp test/test_schmelz.cpp test/test_mix.cpp test/test_funke.cpp test/test_stotter.cpp test/test_grund.cpp test/test_genrafx.cpp test/test_schlag.cpp test/test_box.cpp; do
            g++ -std=gnu++17 -O2 "$t" -o t.exe && ./t.exe || exit 1
          done
          (cd instruments && gcc -std=gnu11 -O2 -w -ffreestanding -fno-builtin -fno-tree-loop-distribute-patterns -Ikwasub/firmware/src -Ikwasub/firmware/gen -Ikwasub/firmware/hal test/kwcore_test.c -o kt.exe -lm && ./kt.exe) || exit 1
          (cd instruments && gcc -std=gnu11 -O2 -w -Iglcore -Igolana/gen test/glcore_test.c -o gt.exe -lm && ./gt.exe) || exit 1
          for t in test/test_tracks.cpp test/test_edit.cpp test/test_store.cpp test/test_midi.cpp test/test_cycle.cpp test/test_match.cpp; do
            g++ -std=gnu++17 -O2 -Isrc "$t" src/genra/Engine.cpp src/genra/Genres.cpp src/genra/Edit.cpp src/genra/Store.cpp src/genra/Midi.cpp -o t.exe && ./t.exe || exit 1
          done
          g++ -std=gnu++17 -O2 -Isrc test/test_ablauf.cpp src/genra/Arranger.cpp src/genra/Engine.cpp src/genra/Genres.cpp src/genra/Edit.cpp src/genra/Store.cpp src/genra/Midi.cpp -o ta.exe && ./ta.exe
          g++ -std=gnu++17 -O2 -Isrc test/test_feel.cpp src/genra/Arranger.cpp src/genra/Engine.cpp src/genra/Genres.cpp src/genra/Edit.cpp src/genra/Store.cpp src/genra/Midi.cpp -o tf.exe && ./tf.exe

      - name: Build plugin GENRA
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=sdk/Rack-SDK SLUG=Genra VERSION=$VER -j4 dist

      - name: Build plugin GENRA Instruments
        run: |
          cd instruments
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=$GITHUB_WORKSPACE/sdk/Rack-SDK SLUG=GenraInstruments VERSION=$VER -j4 dist

      - name: Test the VADER engine (UMLAUF, without Rack)
        run: |
          cd instruments
          gcc -std=gnu11 -O2 -Ivader/src -Ivader/third_party/mpc-vst-plugins/wrapper test/vader_test.c build/vader/libvader.a -lstdc++ -lm -lpthread -o vt.exe
          ./vt.exe vader/shapes

      - name: Check the package
        run: |
          ls -la dist/Genra dist/Genra/res
          test -f dist/Genra/plugin.dll
          test -f dist/Genra/res/drumcore.dll
          test -f dist/Genra/res/Funke.svg
          test -f dist/Genra/res/Stotter.svg
          test -f dist/Genra/res/Schlag.svg
          if test -f dist/Genra/res/Umlauf.svg; then exit 1; fi
          objdump -p dist/Genra/plugin.dll | grep "DLL Name"
          if objdump -p dist/Genra/plugin.dll | grep -iE "libstdc"; then echo "plugin.dll loads libstdc++"; exit 1; fi
          D=instruments/dist/GenraInstruments
          ls -la $D $D/res
          test -f $D/plugin.dll
          for c in voicecore animalcore kwcore glcore; do test -f $D/res/$c.dll; done
          for f in Kwasub KwasubFx Golana GolanaFx Umlauf UmlaufFx Monk JiantVoice JiantAnimal; do test -f $D/res/$f.svg; done
          test -f $D/res/knob/medium.svg
          ls $D/res/umlauf/shapes
          ls $D/res/monk | head -3
          objdump -p $D/plugin.dll | grep "DLL Name"
          if objdump -p $D/plugin.dll | grep -iE "libstdc"; then echo "plugin.dll loads libstdc++"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: genra-windows
          path: dist/*.vcvplugin

      - uses: actions/upload-artifact@v4
        with:
          name: genra-instruments-windows
          path: instruments/dist/*.vcvplugin

  # 2.31.1: macOS, both chips (Apple silicon arm64, Intel x64), built on GitHub's Apple-silicon runner; x64 by
  # cross-compiling with clang -arch x86_64 against the x64 SDK. Not tested on a Mac yet (testers wanted, see README).
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-latest-mac-${{ matrix.arch }}.zip
          mkdir sdk && cd sdk && unzip -q ../sdk.zip

      - name: Compiler
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "CC=clang -arch x86_64" >> $GITHUB_ENV
            echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
          fi
          brew install zstd || true

      - name: Build plugin GENRA
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=$GITHUB_WORKSPACE/sdk/Rack-SDK SLUG=Genra VERSION=$VER -j4 dist

      - name: Build plugin GENRA Instruments
        run: |
          cd instruments
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          make RACK_DIR=$GITHUB_WORKSPACE/sdk/Rack-SDK SLUG=GenraInstruments VERSION=$VER -j4 dist

      - name: Check the package
        run: |
          WANT=$([ "${{ matrix.arch }}" = "x64" ] && echo x86_64 || echo arm64)
          ls -la dist/Genra dist/Genra/res
          test -f dist/Genra/plugin.dylib
          test -f dist/Genra/res/drumcore.dylib
          D=instruments/dist/GenraInstruments
          test -f $D/plugin.dylib
          for c in voicecore animalcore kwcore glcore; do test -f $D/res/$c.dylib; done
          for f in dist/Genra/plugin.dylib dist/Genra/res/drumcore.dylib $D/plugin.dylib $D/res/*core.dylib; do
            echo "$f: $(lipo -archs $f)"
            lipo -archs "$f" | grep -qw "$WANT" || { echo "$f is not $WANT"; exit 1; }
          done
          otool -L dist/Genra/plugin.dylib
          ls dist/*.vcvplugin instruments/dist/*.vcvplugin

      - uses: actions/upload-artifact@v4
        with:
          name: genra-mac-${{ matrix.arch }}
          path: dist/*.vcvplugin

      - uses: actions/upload-artifact@v4
        with:
          name: genra-instruments-mac-${{ matrix.arch }}
          path: instruments/dist/*.vcvplugin

  # a push to the branch "release" publishes GitHub release v<version> with all the plugin files
  release:
    if: github.ref == 'refs/heads/release'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Read the release version
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "RELVER=$VER" >> $GITHUB_ENV
          ls -la files

      - name: Publish the release (tag v-version with the plugin)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELVER }}
          target_commitish: ${{ github.sha }}
          name: GENRA ${{ env.RELVER }}
          files: files/*.vcvplugin
          body: |
            GENRA plugins for VCV Rack 2: GENRA (sequencer, song arranger, groovebox, mixer, effects, drums and a set of
            instruments) and GENRA Instruments (K-WASUB, GOLANA, UMLAUF, MONK, VOICE, ANIMAL). Both appear under the
            brand "Genra" in Rack's browser; the instruments follow GENRA without cables when both are installed.

            Files: `win-x64` = Windows, `mac-arm64` = Mac with Apple chip (M1 and later), `mac-x64` = Intel Mac.
            The Mac builds are new and not tested on a Mac yet: reports are very welcome (see the README).

            Install: download the `.vcvplugin` files for your system and put them into your Rack user folder's plugins
            folder (Rack › Help › Open user folder), then restart Rack.

            What's new: see [PROJEKT.md](https://github.com/Camillowup/Genra-for-Vcv/blob/main/PROJEKT.md) and the README.
